function statsH(){const H=S.hs;if(!H||H.ap.length<2)return '<div class="cd"><h3>📊 สถิติย้อนหลัง</h3><p style="font-size:13px;color:var(--mut);margin:0">ยังไม่มีข้อมูล (บันทึกทุกสิ้นวัน) รอผ่านไปอย่างน้อย 2 วัน</p></div>';
 return chart('📈 สถานะประเทศ',['ap','sec','fr','pt'],['นิยม','มั่นคง','แนวรบ','สภา'],['#ffd166','#5ab0ff','#ff5a5f','#c084fc'],0,100)+chart('💹 เศรษฐกิจ (GDP)',['G'],['GDP'],['#3ddc97'])+chart('🏦 หนี้และคลัง',['debt','cash'],['หนี้','คลัง'],['#ff5a5f','#ffd166'])+chart('🕵️ ทุจริตและกระแสสังคม',['cor','mood'],['ทุจริต','กระแส'],['#fb923c','#38bdf8'],0,100)}
function parH(){const a=paS();return '<div class="cd"><h3>🏛️ พรรคร่วมรัฐบาล</h3><p style="font-size:12px;color:var(--mut);margin:0">พรรคที่พอใจเสริมเสียงสภา พรรคที่ไม่พอใจอาจถอนตัว ปรับนโยบายให้ตรงใจหรือเจรจา</p>'+PA.map((p,i)=>{const t=a[i];return `<div class="lg"><b>${p[1]} พรรค${p[0]}</b> · ที่นั่ง ${p[2]}% ${t.out?'· <span style="color:var(--red)">ถอนตัวแล้ว</span>':''}<br><small>${p[3]}</small><div class="bar"><i style="width:${t.sat}%;background:${t.sat>50?'#3ddc97':t.sat>25?'#e8b04a':'#ff5a5f'}"></i></div><div class="gr" style="margin-top:6px">${t.out?`<button class="ch" onclick="paA(${i},2)">🤝 เชิญกลับ 25</button>`:`<button class="ch" onclick="paA(${i},0)">☕ หารือ 3</button><button class="ch" onclick="paA(${i},1)">🎁 โควตา 15</button>`}</div></div>`}).join('')+'</div>'}
function socH(){const o=so();return `<div class="cd"><h3>📱 โซเชียล</h3><label class="sl">กระแสสังคม<b>${R(o.mood)}</b></label><div class="bar"><i style="width:${o.mood}%;background:${o.mood>60?'#3ddc97':o.mood>35?'#e8b04a':'#ff5a5f'}"></i></div>`+(o.rum.length?o.rum.map(r=>`<div class="lg"><b>📢</b> ${r.q}<div class="bar"><i style="width:${Math.max(0,r.lv)}%;background:#ff5a5f"></i></div><div class="gr" style="margin-top:6px"><button class="ch" onclick="soA(${r.id},0)">📰 แก้ข่าว 6</button><button class="ch" onclick="soA(${r.id},1)">📺 PR สู้ 3</button><button class="ch" onclick="soA(${r.id},2)">⚖️ ฟ้อง 4</button></div></div>`).join(''):'<div class="lg">ยังไม่มีข่าวลือ</div>')+'<h3 style="margin-top:10px">🔥 ฟีดโซเชียล</h3>'+(o.feed.slice(0,8).map(f=>`<div class="lg">${f}</div>`).join('')||'<div class="lg">ยังเงียบ...</div>')+'</div>'}
function xH(){$('vx').innerHTML=statsH()+parH()+socH()}
function dvP(){DV.forEach(d=>{const s=S.dv[d[0]];if(!s||!s.done)return;const k=d[6],a=d[7];if(k=='cash')S.cash+=a*.05;else if(k=='G')S.G=cl(S.G+a*.01,40,220);else S[k]=cl(S[k]+a*.005,0,100)})}
function dvChk(){DV.forEach(d=>{const s=S.dv[d[0]];if(s&&!s.done&&S.day>=s.s+d[5]){s.done=1;S.ap=cl(S.ap+3,0,100);snd('ok');toast('✅ '+d[3]+' '+d[2]+' เสร็จสมบูรณ์ ได้ผลถาวร',4000)}});if($('vg').classList.contains('on'))dvH()}
function poll(){if(S.day%5)return;if(S.ap>=60){S.pt=cl(S.pt+4,0,100);S.cash+=6;toast('📊 โพลนิยมสูง เสียงสภา +4 คลัง +6',4000)}else if(S.ap<35){S.pt=cl(S.pt-5,0,100);toast('📊 โพลนิยมตกต่ำ เสียงสภา −5',4000)}}
function dvBuy(id){const d=DV.find(x=>x[0]==id);if(S.dv[id])return;if(S.cash<d[4])return toast('เงินคลังไม่พอ (ต้อง '+d[4]+')');
 if(d[1]=='ข้อตกลงการค้า'&&S.en.ten>=60)return toast('ความตึงเครียดสูง ประเทศคู่ค้าไม่กล้าเซ็น');
 S.cash-=d[4];S.dv[id]={s:S.day,done:d[5]==0?1:0};snd('ok');toast(d[3]+' '+d[2]+(d[5]?' เริ่มก่อสร้าง '+d[5]+' วัน':' สำเร็จ'));dvH();hud()}
function dvH(){let h='',g='';DV.forEach(d=>{if(d[1]!=g){g=d[1];h+=(h?'</div>':'')+'<div class="cd"><h3>'+g+'</h3>'}const s=S.dv[d[0]];
 h+=`<button class="ln" onclick="dvBuy('${d[0]}')"><span>${d[3]} ${d[2]}<br><small>เสริม${NAME[d[6]]||'GDP'} ถาวร${d[5]?' · ก่อสร้าง '+d[5]+' วัน':''}</small></span><b style="color:var(--gold)">${s?(s.done?'✔':'กำลังสร้าง'):d[4]}</b></button>`});
 $('vg').innerHTML=asC()+cabH()+h+'</div>'}
function gb(){return S.as.b||(S.as.b={eco:0,sec:0,dis:0})}
const AG2={eco:['การเงิน','ภาษี','โกง','พลังงาน','เกษตร'],sec:['ศึก','ใต้','อาชญากรรม','การเมือง'],dis:['เตือน','น้ำท่วม','สุขภาพ','ปัญหา','ร้องเรียน']};
const NB={eco:['📈','สายเศรษฐกิจ'],sec:['🎖️','สายความมั่นคง'],dis:['🌪️','สายภัยพิบัติ']};
function asErr(e){let x=.55-.1*S.as.lv;if(e){const g=Object.keys(AG2).find(k=>AG2[k].includes(e.c));if(g)x-=.08*gb()[g]}return Math.max(.03,x)}
function asB(){if(!S.as.lv)return '';const b=gb();return Object.keys(NB).map(k=>`<button class="ln" onclick="asBU('${k}')"><span>${NB[k][0]} ${NB[k][1]} Lv ${b[k]}/3<br><small>พลาดน้อยลงเมื่อแก้ปัญหาในสายนี้</small></span><b style="color:var(--gold)">${b[k]>=3?'MAX':25*(b[k]+1)}</b></button>`).join('')}
function asBU(k){const b=gb(),c=25*(b[k]+1);if(b[k]>=3)return;if(S.cash<c)return toast('เงินคลังไม่พอ (ต้อง '+c+')');S.cash-=c;b[k]++;snd('ok');toast(NB[k][0]+' '+NB[k][1]+' Lv '+b[k]);dvH();hud()}
function asCd(){return Math.max(2,12-2*S.as.lv)}
function asT(){const a=S.as;if(!a.on||!a.lv)return;S.cash-=.04*a.lv;if(--a.cd>0)return;a.cd=asCd();
 const u=e=>e.k=='f'?100-e.lvl:e.life/e.max*100,c=S.ev.filter(e=>!e.busy&&e.id!=cur&&e.k!='b').sort((x,y)=>u(x)-u(y));if(!c.length)return;
 const e=c[0],ok=Math.random()>asErr(e),p=PV[e.pi].n;
 if(e.k=='f'){if(ok){e.lvl-=15+4*a.lv;if(e.lvl<=0)resolve(e,true,'🧑‍💼 ผู้ช่วยแก้น้ำท่วมที่ '+p+' สำเร็จ',1);else{const b=$('t'+e.id);if(b)b.style.width=e.lvl+'%'}}else toast('🧑‍💼 ผู้ช่วยแก้น้ำท่วมที่ '+p+' ไม่สำเร็จ');return}
 resolve(e,ok,ok?'🧑‍💼 ผู้ช่วยแก้ปัญหาที่ '+p+' สำเร็จ':'🧑‍💼 ผู้ช่วยตัดสินใจพลาดที่ '+p,1)}
function asBtn(){const b=$('ab');if(b)b.textContent='🧑‍💼 ผู้ช่วย: '+(S&&S.as&&S.as.on?'เปิด':'ปิด')}
function asTog(){if(!S.as.lv)return toast('ยังไม่ได้จ้างผู้ช่วย ไปที่แท็บ 🌐 พัฒนา');S.as.on=S.as.on?0:1;S.as.cd=asCd();snd('ok');toast(S.as.on?'🧑‍💼 เรียกใช้ผู้ช่วยแล้ว':'🧑‍💼 หยุดผู้ช่วย');asBtn();dvH()}
function asUp(){const a=S.as,c=30*(a.lv+1);if(a.lv>=5)return;if(S.cash<c)return toast('เงินคลังไม่พอ (ต้อง '+c+')');S.cash-=c;a.lv++;a.cd=Math.min(a.cd,asCd());snd('ok');toast('🧑‍💼 ผู้ช่วย Lv '+a.lv);dvH();hud()}
function asC(){const a=S.as,c=30*(a.lv+1);return `<div class="cd"><h3>🧑‍💼 ผู้ช่วยนายกรัฐมนตรี Lv ${a.lv}/5</h3><p style="font-size:12px;color:var(--mut);margin:0">${a.lv?`แก้ปัญหาอัตโนมัติทุก ${asCd()} วิ · พลาด ${R(asErr()*100)}% · ค่าจ้าง ${(.04*a.lv).toFixed(2)}/วิ`:'จ้างผู้ช่วยเพื่อแก้ปัญหาแทนท่าน (อัปเกรดแล้วเร็วขึ้นและพลาดน้อยลง)'}</p><button class="g" onclick="asTog()">${a.on?'⏸ หยุดผู้ช่วย':'▶ เรียกใช้ผู้ช่วย'}</button><button class="ln" onclick="asUp()"><span>${a.lv?'อัปเกรดผู้ช่วย':'จ้างผู้ช่วย'}</span><b style="color:var(--gold)">${a.lv>=5?'MAX':c}</b></button>${asB()}</div>`}
(function(){const b=document.createElement('button');b.id='ab';b.style.cssText='position:fixed;right:10px;bottom:122px;z-index:7;background:var(--pan);color:var(--fg);border:1px solid var(--ln);border-radius:10px;padding:6px 9px;font-size:13px;cursor:pointer';b.textContent='🧑‍💼 ผู้ช่วย: ปิด';b.onclick=asTog;document.body.appendChild(b)})();
</script>
</body></html>
